
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100808">
<title>DreamFlix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100808;color:white;font-family:Arial,sans-serif}
header{background:#170b0b;padding:18px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:900;color:#ff2525}
nav{display:flex;gap:15px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px;background:#292020;color:white;font-weight:bold}
button:hover{background:#e51d2a}
nav button{background:transparent}
input{padding:13px;border-radius:7px;border:1px solid #555;background:#241919;color:white;width:100%;max-width:420px}
main{padding:22px 4%}
.hero{min-height:360px;border-radius:15px;background:linear-gradient(90deg,#100808 5%,#100808aa 55%,transparent),url('https://image.tmdb.org/t/p/original/7WUHnWGx5OO145IRxPDUkQSh4C7.jpg') center/cover;display:flex;align-items:end;padding:30px;margin-bottom:32px}
.hero h1{font-size:clamp(32px,6vw,58px);margin:0 0 10px}
.hero p{max-width:500px;line-height:1.5}
.section{margin:30px 0}
.section h2{font-size:23px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:16px}
.card{cursor:pointer;min-width:0}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:9px;background:#302020;transition:.2s}
.card img:hover{transform:scale(1.04)}
.card h3{font-size:14px;margin:8px 2px}
.muted{color:#bbb;font-size:13px}
#message{color:#ffb4b4;margin:14px 0}
#details{display:none;margin:20px 0;padding:22px;border-radius:12px;background:#211414}
#details img{width:100%;max-height:350px;object-fit:cover;border-radius:10px}
#details p{line-height:1.6}
footer{padding:25px 4%;color:#aaa;font-size:12px}
@media(max-width:600px){header{position:static}.hero{min-height:280px;padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">DREAMFLIX</div>
  <nav>
    <button onclick="showHome()">Startseite</button>
    <button onclick="showCategory('movie')">Filme</button>
    <button onclick="showCategory('tv')">Serien</button>
    <button onclick="showKids()">Kids</button>
    <button onclick="showWatchlist()">Merkliste</button>
  </nav>
</header>

<main>
  <section class="hero">
    <div>
      <h1>Deine Welt. Deine Filme.</h1>
      <p>Entdecke Filme und Serien auf DreamFlix.</p>
      <button onclick="showSearch()">Jetzt entdecken</button>
    </div>
  </section>

  <section id="searchArea" class="section" style="display:none">
    <h2>DreamFlix Suche</h2>
    <input id="searchInput" placeholder="Film oder Serie suchen..." onkeydown="if(event.key==='Enter')searchTitles()">
    <button onclick="searchTitles()">Suchen</button>
  </section>

  <section id="details"></section>
  <div id="message"></div>
  <section id="catalogue"></section>
</main>

<footer>
  Filmtitel, Beschreibungen und Poster: TMDB.
  This product uses the TMDB API but is not endorsed or certified by TMDB.
</footer>

<script>
const API_URL="https://kcgisbsyewunoomuitsu.supabase.co/functions/v1/smooth-processor";
const IMAGE="https://image.tmdb.org/t/p/w500";
const BACKDROP="https://image.tmdb.org/t/p/original";
let currentItems=[];
let watchlist=JSON.parse(localStorage.getItem("dreamflix-watchlist")||"[]");

function say(text){
 document.getElementById("message").textContent=text||"";
}
function poster(item){
 return item.poster_path ? IMAGE+item.poster_path :
 "https://placehold.co/400x600/211414/ffffff?text=DreamFlix";
}
function title(item){
 return item.title||item.name||"Ohne Titel";
}
function render(items,heading){
 currentItems=items||[];
 const area=document.getElementById("catalogue");
 area.innerHTML="";
 const section=document.createElement("section");
 section.className="section";
 const h=document.createElement("h2");
 h.textContent=heading;
 section.appendChild(h);
 const grid=document.createElement("div");
 grid.className="grid";
 currentItems.forEach((item)=>{
  const card=document.createElement("article");
  card.className="card";
  const img=document.createElement("img");
  img.src=poster(item);
  img.alt=title(item);
  img.loading="lazy";
  img.onerror=()=>{img.src="https://placehold.co/400x600/211414/ffffff?text=DreamFlix"};
  const h3=document.createElement("h3");
  h3.textContent=title(item);
  const p=document.createElement("div");
  p.className="muted";
  p.textContent=item.release_date||item.first_air_date||"";
  card.append(img,h3,p);
  card.onclick=()=>openDetails(item);
  grid.appendChild(card);
 });
 section.appendChild(grid);
 area.appendChild(section);
}
async function searchTitles(){
 const query=document.getElementById("searchInput").value.trim();
 if(!query){say("Bitte gib einen Filmtitel ein.");return}
 say("DreamFlix sucht...");
 document.getElementById("details").style.display="none";
 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({query})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Suche fehlgeschlagen");
  const items=(data.results||[]).filter(x=>
   (x.media_type==="movie"||x.media_type==="tv")&&
   (x.poster_path||x.backdrop_path)
  );
  render(items,"Suchergebnisse");
  say(items.length?items.length+" Ergebnisse gefunden.":"Keine Ergebnisse gefunden.");
 }catch(error){
  say("Verbindung fehlgeschlagen: "+error.message);
 }
}
function showSearch(){
 document.getElementById("searchArea").style.display="block";
 document.getElementById("searchInput").focus();
 document.getElementById("catalogue").innerHTML="";
 say("");
}
function showCategory(kind){
 showSearch();
 document.getElementById("searchInput").value=kind==="movie"?"":"";
 document.getElementById("searchInput").placeholder=
 kind==="movie"?"Film suchen...":"Serie suchen...";
 document.getElementById("searchInput").dataset.kind=kind;
}
function showKids(){
 showSearch();
 document.getElementById("searchInput").placeholder="Kinderfilm oder Kinderserie suchen...";
 document.getElementById("searchInput").value="";
}
function showHome(){
 document.getElementById("searchArea").style.display="none";
 document.getElementById("details").style.display="none";
 say("Suche zum Beispiel nach Miraculous, Rapunzel oder Frozen.");
 document.getElementById("catalogue").innerHTML="";
}
function openDetails(item){
 const box=document.getElementById("details");
 box.style.display="block";
 box.innerHTML="";
 const img=document.createElement("img");
 img.src=item.backdrop_path?BACKDROP+item.backdrop_path:poster(item);
 img.alt=title(item);
 const h=document.createElement("h2");
 h.textContent=title(item);
 const p=document.createElement("p");
 p.textContent=item.overview||"Für diesen Titel ist keine Beschreibung verfügbar.";
 const info=document.createElement("p");
 info.className="muted";
 info.textContent="Bewertung: "+(item.vote_average||"–")+"/10";
 const save=document.createElement("button");
 save.textContent=watchlist.some(x=>x.id===item.id)?"In Merkliste gespeichert":"＋ Merkliste";
 save.onclick=()=>toggleWatchlist(item);
 box.append(img,h,p,info,save);
 box.scrollIntoView({behavior:"smooth"});
}
function toggleWatchlist(item){
 if(watchlist.some(x=>x.id===item.id)){
  watchlist=watchlist.filter(x=>x.id!==item.id);
 }else{watchlist.push(item)}
 localStorage.setItem("dreamflix-watchlist",JSON.stringify(watchlist));
 openDetails(item);
}
function showWatchlist(){
 document.getElementById("searchArea").style.display="none";
 document.getElementById("details").style.display="none";
 render(watchlist,"Meine Merkliste");
 say("");
}
showHome();
</script>
</body>
</html>
