
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamFlix Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#171717;color:#ff3030;font-size:25px;font-weight:bold}
main{max-width:850px;margin:auto;padding:16px}
video{width:100%;background:black;border-radius:12px}
h2{margin-top:25px}
.settings{background:#1c1c1c;padding:18px;border-radius:14px;margin-top:15px}
label{display:block;margin:15px 0 7px;font-weight:bold}
select,button{width:100%;padding:13px;border-radius:8px;border:0;font-size:15px}
select{background:#303030;color:white}
button{background:#e50914;color:white;margin-top:12px;font-weight:bold}
.note{color:#aaa;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<header> DREAMFLIX</header>
<main>
<h1 id="filmTitle">DreamFlix Player</h1>

<video id="player" controls playsinline>
  <!-- Hier eine rechtmäßig nutzbare Videodatei eintragen -->
</video>

<div class="settings">
<h2>⚙️ Wiedergabeeinstellungen</h2>

<label>🌍 Audio / Sprache</label>
<select id="audio">
<option value="">Originalton / Standard</option>
</select>

<label>💬 Untertitel</label>
<select id="subtitles">
<option value="-1">Aus</option>
</select>

<label>🎥 Videoqualität</label>
<select id="quality">
<option value="auto">Automatisch – beste verfügbare</option>
<option value="2160">4K Ultra HD (2160p)</option>
<option value="1080">Full HD (1080p)</option>
<option value="720">HD (720p)</option>
</select>

<button onclick="applySettings()">Einstellungen übernehmen</button>
<p class="note" id="status">
Die verfügbaren Sprachen und Qualitätsstufen hängen von der Videodatei ab.
</p>
</div>
</main>

<script>
const video=document.getElementById("player");
const audio=document.getElementById("audio");
const subtitles=document.getElementById("subtitles");
const quality=document.getElementById("quality");
const status=document.getElementById("status");

function loadTracks(){
 audio.innerHTML='<option value="">Originalton / Standard</option>';
 subtitles.innerHTML='<option value="-1">Aus</option>';

 for(let i=0;i<video.audioTracks?.length;i++){
   const track=video.audioTracks[i];
   const option=document.createElement("option");
   option.value=i;
   option.textContent=track.label||track.language||"Audiospur "+(i+1);
   audio.appendChild(option);
 }
 for(let i=0;i<video.textTracks.length;i++){
   const track=video.textTracks[i];
   const option=document.createElement("option");
   option.value=i;
   option.textContent=track.label||track.language||"Untertitel "+(i+1);
   subtitles.appendChild(option);
 }
}

function applySettings(){
 const selectedAudio=audio.value;
 if(video.audioTracks && selectedAudio!==""){
   for(let i=0;i<video.audioTracks.length;i++){
     video.audioTracks[i].enabled=(i===Number(selectedAudio));
   }
 }
 for(let i=0;i<video.textTracks.length;i++){
   video.textTracks[i].mode=
     (selectedAudio!=="" && i===Number(subtitles.value))
       ?"showing":"disabled";
 }
 if(subtitles.value!=="-1"){
   const track=video.textTracks[Number(subtitles.value)];
   if(track)track.mode="showing";
 }
 status.textContent="Einstellungen übernommen, soweit die Videodatei sie unterstützt.";
}

video.addEventListener("loadedmetadata",loadTracks);
</script>
</body>
</html>
